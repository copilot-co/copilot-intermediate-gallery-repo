name: "AI Workforce - Step 9: Reflect"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-9') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: "true"
    steps:
      - run: echo "Tracking issue ${{ github.event.issue.number }} is at that step."

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = context.payload.comment.body || '';
            const r = helpers.checkReflection(body);
            const passed = r.hasWorkforceWins && r.hasHumanDecision && r.hasFutureFeature;

            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `Your reflection needs all three: what the workforce handled (found: ${r.hasWorkforceWins}), a decision only you made (found: ${r.hasHumanDecision}), and a different future feature naming which pillars carry over (found: ${r.hasFutureFeature}). Add whichever is missing and comment again.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-completion.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-9', 'completed');
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed' });
