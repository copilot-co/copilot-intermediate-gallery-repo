name: "AI Workforce - Step 4: Simulate an integration"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-4') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - id: find
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          NUM=$(echo "$COMMENT_BODY" | grep -ioE 'Integration PR:\s*#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$NUM" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = Number('${{ needs.find_exercise.outputs.pr_number }}');
            let files = [];
            let comments = [];
            try {
              const res = await github.rest.pulls.listFiles({ ...context.repo, pull_number: prNumber });
              files = res.data;
              comments = (await github.rest.issues.listComments({ ...context.repo, issue_number: prNumber })).data;
            } catch (e) {
              await helpers.postComment(github, context, context.issue.number,
                `I couldn't find PR #${prNumber} — double check the number and comment again.`);
              core.setOutput('passed', 'false');
              return;
            }

            const mockFiles = files.filter((f) =>
              /mock-integration/i.test(f.filename) || /\.github\/workflows\/.*integration/i.test(f.filename));
            const combinedPatch = files.map((f) => f.patch || '').join('\n');
            const hasFileEvidence = mockFiles.length >= 1 &&
              helpers.hasNoteCallout(combinedPatch) && /webhook/i.test(combinedPatch);

            const hasCommentEvidence = comments.some((c) => {
              const body = c.body || '';
              return /slack|teams/i.test(body) && helpers.hasNoteCallout(body) && /webhook/i.test(body);
            });

            const passed = hasFileEvidence || hasCommentEvidence;

            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `PR #${prNumber} needs a mock integration file (e.g. \`mock-integration-output.json\` or a workflow under \`.github/workflows/\`) plus a \`[!NOTE]\` callout mentioning where a real webhook would go — or a PR comment with the mock Slack/Teams payload, a \`[!NOTE]\` callout, and a mention of the real webhook.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-5-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-4', 'step-5');
