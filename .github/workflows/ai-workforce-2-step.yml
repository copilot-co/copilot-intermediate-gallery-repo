name: "AI Workforce - Step 2: Context library"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-2') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const m = (context.payload.comment.body || '').match(/Context PR:\s*#(\d+)/i);
            core.setOutput('found', String(!!m));
            core.setOutput('pr_number', m ? m[1] : '');

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = Number('${{ needs.find_exercise.outputs.pr_number }}');
            let files = [];
            try {
              const res = await github.rest.pulls.listFiles({ ...context.repo, pull_number: prNumber });
              files = res.data;
            } catch (e) {
              await helpers.postComment(github, context, context.issue.number,
                `I couldn't find PR #${prNumber} — double check the number and comment again.`);
              core.setOutput('passed', 'false');
              return;
            }

            const requiredContextFiles = [
              '.github/prompts/context-feature.prompt.md',
              '.github/prompts/context-bugfix.prompt.md',
              '.github/prompts/context-docs.prompt.md',
            ];
            const contextFiles = files.filter((f) => requiredContextFiles.includes(f.filename));
            const withKnownFile = contextFiles.filter((f) => helpers.mentionsKnownFile(f.patch || ''));
            const passed = contextFiles.length === requiredContextFiles.length &&
              withKnownFile.length === requiredContextFiles.length;

            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `PR #${prNumber} has ${contextFiles.length} prompt file(s) under \`.github/prompts/\` and ${withKnownFile.length} referencing a real repo file/pattern. Add 3 files (feature, bugfix, docs), each naming something concrete like \`GalleryGrid.tsx\` or \`mock-photo-data.ts\`, then comment again.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = '${{ needs.find_exercise.outputs.pr_number }}';
            await helpers.addLabels(github, context, context.issue.number, [`ctx-pr-${prNumber}`]);
            const body = fs.readFileSync('.github/steps/ai-workforce-3-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-2', 'step-3');
