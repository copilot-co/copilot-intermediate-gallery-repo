name: "AI Workforce - Step 7: Orchestrate the agents"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-7') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: "true"
    steps:
      - run: echo "Tracking issue ${{ github.event.issue.number }} is at that step."

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = context.payload.comment.body || '';
            const command = body.match(/\/(fleet|orchestrate)\b/i)?.[1] || null;
            const graph = helpers.checkMermaidGraph(helpers.extractMermaidBlock(body), { minNodes: 5 });
            const roles = ['component', 'test', 'review'];
            const roleCount = roles.filter((role) => new RegExp(role, 'i').test(body)).length;
            const passed = Boolean(command) && graph.passes && roleCount === roles.length;
            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `Orchestration check: command = ${command || 'missing'}, nodes = ${graph.nodeCount}/5, fan-out = ${graph.hasFanOut}, human review = ${graph.hasEscalation}, agent roles = ${roleCount}/3. Include \`/fleet\` or \`/orchestrate\` and a Mermaid diagram with all required elements.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-8-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-7', 'step-8');
