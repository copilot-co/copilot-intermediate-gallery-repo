name: "AI Workforce - Step 7: Agent graph"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-7') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: "true"
    steps:
      - run: echo "Tracking issue ${{ github.event.issue.number }} is at that step."

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const commentBody = context.payload.comment.body || '';
            let source = commentBody;

            const prMatch = commentBody.match(/Graph PR:\s*#(\d+)/i);
            if (prMatch) {
              try {
                const files = (await github.rest.pulls.listFiles({ ...context.repo, pull_number: Number(prMatch[1]) })).data;
                source += '\n' + files.map((f) => f.patch || '').join('\n');
              } catch (e) {
                // fall back to whatever mermaid is in the comment itself
              }
            }

            const mermaid = helpers.extractMermaidBlock(source);
            const check = helpers.checkMermaidGraph(mermaid, { minNodes: 3 });
            const passed = !!check.passes;

            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `Your mermaid graph has ${check.nodeCount} node(s), fan-out = ${check.hasFanOut}, escalation label = ${check.hasEscalation}. Needs \u2265 3 nodes, one node fanning out to 2+ targets, and an edge/node labeled for escalation (e.g. "low confidence" or "human").`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-8-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-7', 'step-8');
