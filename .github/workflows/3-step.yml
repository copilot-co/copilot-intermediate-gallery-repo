name: "Agentic Exercise · 3 Context-engineered spec"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  find_exercise:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agentic-exercise') &&
      contains(github.event.issue.labels.*.name, 'step-3') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - run: echo "Checking Step 3 on tracking issue number ${{ github.event.issue.number }}"

  check_step_work:
    needs: find_exercise
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      spec_issue: ${{ steps.check.outputs.spec_issue }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};
            const comment = context.payload.comment.body || '';
            const refs = helpers.extractIssueRefs(comment).filter(n => n !== issue_number);

            if (refs.length === 0) {
              await helpers.postComment(github, context, issue_number,
                `### 🔧 Not quite yet\n\nI didn't find a spec issue reference in your comment. Comment again with something like \`Spec issue: #45\`.`);
              core.setOutput('passed', 'false');
              return;
            }

            const specNumber = refs[0];
            let specIssue;
            try {
              const res = await github.rest.issues.get({ ...context.repo, issue_number: specNumber });
              specIssue = res.data;
            } catch (e) {
              await helpers.postComment(github, context, issue_number,
                `### 🔧 Not quite yet\n\nI couldn't find issue #${specNumber} in this repo. Double-check the number and comment again.`);
              core.setOutput('passed', 'false');
              return;
            }

            const body = specIssue.body || '';
            const criteriaCount = helpers.countBulletsUnderHeading(body, 'Acceptance Criteria');
            const hasNonGoals = helpers.hasSection(body, 'Non-goals');
            const mentionsFile = helpers.mentionsKnownFile(body);
            const passed = criteriaCount >= 3 && hasNonGoals && mentionsFile;

            if (!passed) {
              const missing = [];
              if (criteriaCount < 3) missing.push(`an \`## Acceptance Criteria\` heading with at least 3 bullets (found ${criteriaCount})`);
              if (!hasNonGoals) missing.push('a `## Non-goals` heading');
              if (!mentionsFile) missing.push('a reference to a real repo file (e.g. `GalleryGrid.tsx`, `mock-photo-data.ts`)');
              await helpers.postComment(github, context, issue_number,
                `### 🔧 Not quite yet\n\nSpec issue #${specNumber} is missing:\n\n${missing.map(m => `- ${m}`).join('\n')}\n\nUpdate #${specNumber} and comment here again once it's ready.`);
              core.setOutput('passed', 'false');
              return;
            }

            core.setOutput('passed', 'true');
            core.setOutput('spec_issue', String(specNumber));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};
            const specIssue = '${{ needs.check_step_work.outputs.spec_issue }}';

            await helpers.swapLabel(github, context, issue_number, 'step-3', 'step-4');
            await helpers.addLabels(github, context, issue_number, [`spec-${specIssue}`]);

            let body = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/.github/steps/4-step.md`,
              'utf8'
            );
            body = body.replaceAll('{{specIssue}}', specIssue);
            await helpers.postComment(github, context, issue_number, body);
