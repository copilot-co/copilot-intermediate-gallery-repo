name: "Agentic Exercise · 5 Review the PR"

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: read

jobs:
  find_exercise:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      issue_number: ${{ steps.find.outputs.issue_number }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const author = context.payload.comment?.user?.login || context.payload.review?.user?.login;
            const prNumber = context.payload.pull_request.number;

            if (!author || author.endsWith('[bot]')) {
              core.setOutput('found', 'false');
              return;
            }

            const issue = await helpers.findIssueByLabels(github, context, ['step-5', `pr-${prNumber}`]);
            core.setOutput('found', String(Boolean(issue)));
            if (issue) {
              core.setOutput('issue_number', String(issue.number));
              core.setOutput('pr_number', String(prNumber));
            }

  post_next_step_content:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = Number('${{ needs.find_exercise.outputs.issue_number }}');
            const prNumber = '${{ needs.find_exercise.outputs.pr_number }}';

            await helpers.swapLabel(github, context, issue_number, 'step-5', 'step-6');

            let body = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/.github/steps/6-step.md`,
              'utf8'
            );
            body = body.replaceAll('{{pr}}', prNumber);
            await helpers.postComment(github, context, issue_number, body);
