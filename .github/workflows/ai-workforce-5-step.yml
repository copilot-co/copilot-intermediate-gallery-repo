name: "AI Workforce - Step 5: Create the agents"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-5') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - id: find
        uses: actions/github-script@v7
        with:
          script: |
            const match = (context.payload.comment.body || '').match(/Agents PR:\s*#(\d+)/i);
            core.setOutput('found', String(Boolean(match)));
            if (match) core.setOutput('pr_number', match[1]);

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = Number('${{ needs.find_exercise.outputs.pr_number }}');
            try {
              const files = (await github.rest.pulls.listFiles({ ...context.repo, pull_number: prNumber })).data;
              const required = [
                '.github/agents/component.agent.md',
                '.github/agents/test.agent.md',
                '.github/agents/review.agent.md',
              ];
              const present = required.filter((path) =>
                files.some((file) => file.filename === path && file.status !== 'removed'));
              const reviewFile = files.find((file) => file.filename === '.github/agents/review.agent.md');
              const usesSkill = /web-design-reviewer/i.test(reviewFile?.patch || '');
              const passed = present.length === required.length && usesSkill;
              if (!passed) {
                await helpers.postComment(github, context, context.issue.number,
                  `PR #${prNumber} includes ${present.length}/3 required agent files. Review agent references \`web-design-reviewer\` = ${usesSkill}. Add what is missing, push the changes, and comment again.`);
              }
              core.setOutput('passed', String(passed));
            } catch (error) {
              await helpers.postComment(github, context, context.issue.number,
                `I couldn't find PR #${prNumber}. Check the number and comment again.`);
              core.setOutput('passed', 'false');
            }

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-6-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-5', 'step-6');
