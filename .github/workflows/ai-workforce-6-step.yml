name: "AI Workforce - Step 6: Invoke the agents"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-6') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: "true"
    steps:
      - run: echo "Tracking issue ${{ github.event.issue.number }} is at that step."

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = context.payload.comment.body || '';
            const check = helpers.checkAgentRoleSections(body);
            const hasMarker = /agents\s+invoked/i.test(body);
            const passed = hasMarker && check.passes;
            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `I found the \`Agents invoked\` marker = ${hasMarker} and ${check.present.length}/3 recommendation sections. Summarize the component, test, and review agent responses using the requested format.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-7-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-6', 'step-7');
