name: "AI Workforce - Step 6: Parallel subagents"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-6') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - id: find
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          NUM=$(echo "$COMMENT_BODY" | grep -ioE 'Workforce PR:\s*#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$NUM" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = Number('${{ needs.find_exercise.outputs.pr_number }}');
            let pr, commits, comments;
            try {
              pr = (await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })).data;
              commits = (await github.rest.pulls.listCommits({ ...context.repo, pull_number: prNumber })).data;
              comments = (await github.rest.issues.listComments({ ...context.repo, issue_number: prNumber })).data;
            } catch (e) {
              await helpers.postComment(github, context, context.issue.number,
                `I couldn't find PR #${prNumber} — double check the number and comment again.`);
              core.setOutput('passed', 'false');
              return;
            }

            const roles = ['component', 'tests?', 'docs?'];
            const commitText = commits.map((c) => c.commit.message).join('\n');
            const commentText = [pr.body || '', ...comments.map((c) => c.body || '')].join('\n');
            const combined = `${commitText}\n${commentText}`;
            const subagentMentions = helpers.countSubagentMentions(combined, roles);

            const hasResult = comments.some((c) => /pass|fail|✅|❌/i.test(c.body || ''));

            const passed = subagentMentions >= 2 && hasResult;

            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `PR #${prNumber}: found ${subagentMentions}/3 subagent role mention(s) (component/tests/docs) and test-result comment present = ${hasResult}. Make sure commits/comments attribute work to at least 2 subagents, and the reactive testing agent has posted a pass/fail result.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-7-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-6', 'step-7');
