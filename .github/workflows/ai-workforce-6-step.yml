name: "AI Workforce - Step 6: Invoke and orchestrate the agents"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  find_exercise:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-6') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - id: find
        uses: actions/github-script@v7
        with:
          script: |
            const match = (context.payload.comment.body || '').match(/Favorites PR:\s*#(\d+)/i);
            core.setOutput('found', String(Boolean(match)));
            if (match) core.setOutput('pr_number', match[1]);

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = Number('${{ needs.find_exercise.outputs.pr_number }}');
            const commentBody = context.payload.comment.body || '';
            const usedFleet = /\/fleet\b/i.test(commentBody);
            const usedOrchestrate = /\/orchestrate\b/i.test(commentBody);

            try {
              const pr = (await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })).data;
              const files = (await github.rest.pulls.listFiles({ ...context.repo, pull_number: prNumber })).data;
              const isLearnerPr = pr.user.login === context.payload.issue.user.login;
              const hasFavoritesChange = files.some((file) =>
                /favorite/i.test(file.filename) || /favorite/i.test(file.patch || ''));
              const passed = usedFleet && usedOrchestrate && isLearnerPr && hasFavoritesChange;

              if (!passed) {
                await helpers.postComment(github, context, context.issue.number,
                  `Check: mentioned /fleet = ${usedFleet}, mentioned /orchestrate = ${usedOrchestrate}, learner-owned PR = ${isLearnerPr}, Favorites change = ${hasFavoritesChange}. Update the code or comment, then try again.`);
              }
              core.setOutput('passed', String(passed));
            } catch (error) {
              await helpers.postComment(github, context, context.issue.number,
                `I couldn't find PR #${prNumber}. Check the number and comment again once it is open.`);
              core.setOutput('passed', 'false');
            }

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const prNumber = '${{ needs.find_exercise.outputs.pr_number }}';
            await helpers.addLabels(github, context, context.issue.number, [`favorites-pr-${prNumber}`]);
            const body = fs.readFileSync('.github/steps/ai-workforce-7-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-6', 'step-7');
