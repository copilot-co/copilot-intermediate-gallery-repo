name: "Agentic Exercise · 2 Classify steps"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  find_exercise:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agentic-exercise') &&
      contains(github.event.issue.labels.*.name, 'step-2') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - run: echo "Checking Step 2 on tracking issue number ${{ github.event.issue.number }}"

  check_step_work:
    needs: find_exercise
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};
            const comment = context.payload.comment.body || '';

            const hasDelegate = /\[Delegate\]/i.test(comment);
            const hasHuman = /\[Human\]/i.test(comment);
            const passed = hasDelegate && hasHuman;

            if (!passed) {
              const missing = [];
              if (!hasDelegate) missing.push('at least one step tagged `[Delegate]`');
              if (!hasHuman) missing.push('at least one step tagged `[Human]`');
              await helpers.postComment(github, context, issue_number,
                `### 🔧 Not quite yet\n\nYour classification comment is missing ${missing.join(' and ')}. Tag each step and try again.`);
            }

            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};

            await helpers.swapLabel(github, context, issue_number, 'step-2', 'step-3');
            const body = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/.github/steps/3-step.md`,
              'utf8'
            );
            await helpers.postComment(github, context, issue_number, body);
