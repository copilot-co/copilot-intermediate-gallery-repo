name: "Proactive Feedback"

# Runs the Proactive Feedback agent (.github/agents/proactive-feedback.agent.md)
# on a daily schedule so open issues get triaged and ranked before anyone has
# to ask. `workflow_dispatch` is included only so maintainers can trigger an
# out-of-band run for testing — the daily cron is the real trigger.
on:
  schedule:
    - cron: '0 13 * * *' # once per day, 13:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  proactive-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run proactive feedback agent
        id: agent
        uses: github/copilot-cli-action@v1
        with:
          agent: .github/agents/proactive-feedback.agent.md
          prompt: |
            Scan all open issues in copilot-co/copilot-intermediate-gallery-repo
            and follow your agent instructions to assess impact, urgency, and
            effort for each one. Produce a report that ends with an explicit,
            numbered priority ranking (e.g. "1. ... 2. ... 3. ...") of what
            maintainers should address first.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ranking as an issue
        uses: actions/github-script@v7
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.result }}
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const body = process.env.AGENT_OUTPUT || 'The agent produced no output.';
            await github.rest.issues.create({
              ...context.repo,
              title: `Proactive Feedback — ${today}`,
              body,
              labels: ['proactive-feedback'],
            });
