name: "Agentic Exercise · 1 Baseline workflow"

on:
  issues:
    types: [edited]

permissions:
  issues: write

jobs:
  find_exercise:
    if: |
      contains(github.event.issue.labels.*.name, 'agentic-exercise') &&
      contains(github.event.issue.labels.*.name, 'step-1')
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - run: echo "Checking Step 1 on tracking issue number ${{ github.event.issue.number }}"

  check_step_work:
    needs: find_exercise
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};
            const body = context.payload.issue.body || '';

            const itemCount = helpers.countListItems(body);
            const mentionsExplore = helpers.hasSection(body, 'explore|codebase');
            const mentionsReview = helpers.hasSection(body, 'review|merge');
            const passed = itemCount >= 4 && mentionsExplore && mentionsReview;

            if (!passed) {
              const missing = [];
              if (itemCount < 4) missing.push(`at least 4 list items (found ${itemCount})`);
              if (!mentionsExplore) missing.push('a step about exploring the codebase');
              if (!mentionsReview) missing.push('a step about review or merge');
              await helpers.postComment(github, context, issue_number,
                `### 🔧 Not quite yet\n\nYour baseline workflow is missing:\n\n${missing.map(m => `- ${m}`).join('\n')}\n\nEdit the issue body above and I'll check again.`);
            }

            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};

            await helpers.swapLabel(github, context, issue_number, 'step-1', 'step-2');
            const body = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/.github/steps/2-step.md`,
              'utf8'
            );
            await helpers.postComment(github, context, issue_number, body);
