name: "Agentic Exercise · 7 Merge"

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  find_exercise:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      issue_number: ${{ steps.find.outputs.issue_number }}
      spec_issue: ${{ steps.find.outputs.spec_issue }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const prNumber = context.payload.pull_request.number;

            const issue = await helpers.findIssueByLabels(github, context, ['step-7', `pr-${prNumber}`]);
            core.setOutput('found', String(Boolean(issue)));
            if (issue) {
              core.setOutput('issue_number', String(issue.number));
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('spec_issue', String(helpers.readRefLabel(issue, 'spec') ?? ''));
            }

  post_next_step_content:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = Number('${{ needs.find_exercise.outputs.issue_number }}');
            const prNumber = '${{ needs.find_exercise.outputs.pr_number }}';
            const specIssue = '${{ needs.find_exercise.outputs.spec_issue }}';

            await helpers.swapLabel(github, context, issue_number, 'step-7', 'step-8');

            let body = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/.github/steps/8-step.md`,
              'utf8'
            );
            body = body.replaceAll('{{pr}}', prNumber).replaceAll('{{specIssue}}', specIssue);
            await helpers.postComment(github, context, issue_number, body);
