name: "AI Workforce - Step 1: Baseline friction"

on:
  issues:
    types: [edited]

permissions:
  issues: write
  contents: read

jobs:
  find_exercise:
    if: >-
      contains(github.event.issue.labels.*.name, 'ai-workforce') &&
      contains(github.event.issue.labels.*.name, 'step-1')
    runs-on: ubuntu-latest
    outputs:
      found: "true"
    steps:
      - run: echo "Tracking issue ${{ github.event.issue.number }} is at that step."

  check_step_work:
    needs: find_exercise
    if: needs.find_exercise.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.grade.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: grade
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = context.payload.issue.body || '';
            const count = helpers.countListItems(body);
            const passed = count >= 3;
            if (!passed) {
              await helpers.postComment(github, context, context.issue.number,
                `Almost — I count ${count} friction point(s) in the issue body right now. List **3-4 specific** things that slow you down in this repo (reference a real file or pattern where you can), then save the edit again.`);
            }
            core.setOutput('passed', String(passed));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/ai-workforce-helpers.js`);
            const body = fs.readFileSync('.github/steps/ai-workforce-2-step.md', 'utf8');
            await helpers.postComment(github, context, context.issue.number, body);
            await helpers.swapLabel(github, context, context.issue.number, 'step-1', 'step-2');
