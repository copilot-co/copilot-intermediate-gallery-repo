name: "Agentic Exercise · 8 Reflect & complete"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  find_exercise:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agentic-exercise') &&
      contains(github.event.issue.labels.*.name, 'step-8') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - run: echo "Checking Step 8 on tracking issue number ${{ github.event.issue.number }}"

  check_step_work:
    needs: find_exercise
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      spec_issue: ${{ steps.check.outputs.spec_issue }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};
            const comment = context.payload.comment.body || '';
            const issue = context.payload.issue;

            const specIssue = helpers.readRefLabel(issue, 'spec');
            const prNumber = helpers.readRefLabel(issue, 'pr');
            const wordCount = comment.trim().split(/\s+/).filter(Boolean).length;

            const referencesSpec = specIssue && comment.includes(`#${specIssue}`);
            const referencesPr = prNumber && comment.includes(`#${prNumber}`);
            const passed = Boolean(referencesSpec) && Boolean(referencesPr) && wordCount >= 30;

            if (!passed) {
              const missing = [];
              if (!referencesSpec) missing.push(`a reference to your spec issue (\`#${specIssue}\`)`);
              if (!referencesPr) missing.push(`a reference to your PR (\`#${prNumber}\`)`);
              if (wordCount < 30) missing.push(`more detail (at least ~30 words, found ${wordCount})`);
              await helpers.postComment(github, context, issue_number,
                `### 🔧 Not quite yet\n\nYour reflection is missing:\n\n${missing.map(m => `- ${m}`).join('\n')}\n\nPost another comment with your full reflection.`);
              core.setOutput('passed', 'false');
              return;
            }

            core.setOutput('passed', 'true');
            core.setOutput('spec_issue', String(specIssue));
            core.setOutput('pr_number', String(prNumber));

  post_next_step_content:
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/scripts/agentic-exercise-helpers.js`);
            const issue_number = ${{ needs.find_exercise.outputs.issue_number }};
            const specIssue = '${{ needs.check_step_work.outputs.spec_issue }}';
            const prNumber = '${{ needs.check_step_work.outputs.pr_number }}';

            await helpers.swapLabel(github, context, issue_number, 'step-8', 'completed');

            let body = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/.github/steps/completion.md`,
              'utf8'
            );
            body = body.replaceAll('{{specIssue}}', specIssue).replaceAll('{{pr}}', prNumber);
            await helpers.postComment(github, context, issue_number, body);

            await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed' });
